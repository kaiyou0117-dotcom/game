<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サマノ・スペクトゥス 戦闘（レイアウト確認）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-black: #0b0a12;
    --ink-black-2: #14121e;
    --parchment: #ecdfc0;
    --parchment-edge: #cbb98a;
    --ink-text: #1b1710;
    --gold: #c9a227;
    --arcane: #7c5cff;
    --arcane-dim: #4a3a8a;
    --blood: #d1394a;
    --paper-faint: rgba(236, 223, 192, 0.06);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink-black);
    color: var(--parchment);
    font-family: 'DotGothic16', sans-serif;
    overflow: hidden;
  }

  .glyph-field {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .glyph {
    position: absolute;
    color: var(--paper-faint);
    font-family: 'Shippori Mincho', serif;
    font-size: 28px;
    animation: drift 22s linear infinite;
    user-select: none;
  }
  @keyframes drift {
    from { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    to { transform: translateY(-120vh); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .glyph { animation: none; display: none; }
  }

  .stage[data-locked="true"] {
    opacity: 0;
    pointer-events: none;
  }
  .stage {
    transition: opacity 0.3s ease;
  }

  .stage {
    position: relative;
    z-index: 1;
    width: min(720px, 94vw);
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    padding: 16px 0;
  }


  /* ---- Opening / difficulty select screen ---- */
  .opening {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: var(--ink-black);
    padding: 24px;
    text-align: center;
    transition: opacity 0.4s ease;
  }
  .opening[data-hidden="true"] {
    opacity: 0;
    pointer-events: none;
  }
  .opening-title {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: clamp(22px, 5vw, 32px);
    color: var(--gold);
    letter-spacing: 0.08em;
  }
  .opening-sub {
    font-family: 'DotGothic16', sans-serif;
    font-size: 12px;
    color: var(--parchment);
    opacity: 0.55;
    letter-spacing: 0.06em;
    margin-top: -14px;
  }
  .difficulty-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .diff-btn {
    width: 168px;
    background: var(--ink-black-2);
    border: 3px solid var(--gold);
    color: var(--parchment);
    font-family: 'DotGothic16', sans-serif;
    cursor: pointer;
    padding: 16px 12px;
    text-align: center;
  }
  .diff-btn:hover,
  .diff-btn:focus-visible {
    background: var(--gold);
    color: var(--ink-black);
    outline: none;
  }
  .diff-btn:focus-visible {
    outline: 2px solid var(--arcane);
    outline-offset: 3px;
  }
  .diff-name {
    font-size: 17px;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .diff-desc {
    font-size: 11px;
    opacity: 0.7;
    line-height: 1.6;
  }

  /* ---- Game over overlay ---- */
  .gameover-title {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: clamp(24px, 6vw, 36px);
    color: var(--blood);
    letter-spacing: 0.1em;
    animation: gameoverPulse 1.8s ease-in-out infinite;
  }
  @keyframes gameoverPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gameover-title { animation: none; }
  }
  .gameover-sub {
    font-family: 'DotGothic16', sans-serif;
    font-size: 13px;
    color: var(--parchment);
    opacity: 0.7;
    letter-spacing: 0.04em;
    margin-top: -14px;
  }
  .retry-btn {
    background: var(--ink-black-2);
    border: 3px solid var(--blood);
    color: var(--parchment);
    font-family: 'DotGothic16', sans-serif;
    font-size: 15px;
    letter-spacing: 0.08em;
    cursor: pointer;
    padding: 14px 32px;
  }
  .retry-btn:hover,
  .retry-btn:focus-visible {
    background: var(--blood);
    color: var(--ink-black);
    outline: none;
  }
  .retry-btn:focus-visible {
    outline: 2px solid var(--arcane);
    outline-offset: 3px;
  }

  .victory-title {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: clamp(24px, 6vw, 36px);
    color: var(--gold);
    letter-spacing: 0.1em;
    animation: gameoverPulse 1.8s ease-in-out infinite;
  }
  .retry-btn.victory {
    border-color: var(--gold);
  }
  .retry-btn.victory:hover,
  .retry-btn.victory:focus-visible {
    background: var(--gold);
    color: var(--ink-black);
  }

  /* small in-battle difficulty badge */
  .difficulty-badge {
    position: fixed;
    top: 10px;
    right: 14px;
    font-family: 'DotGothic16', sans-serif;
    font-size: 11px;
    color: var(--gold);
    opacity: 0.5;
    letter-spacing: 0.06em;
    z-index: 2;
  }

  .boss-sprite-wrap {
    display: flex;
    justify-content: center;
    padding: 4px 0 2px;
  }
  .boss-sprite {
    width: min(280px, 60%);
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 18px rgba(124, 92, 255, 0.25));
    animation: bossIdle 3.2s ease-in-out infinite;
  }
  @keyframes bossIdle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .boss-sprite { animation: none; }
  }

  .stat-row {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 6px;
    font-size: 15px;
  }
  .stat-name {
    font-weight: 400;
    letter-spacing: 0.05em;
  }
  .stat-lv {
    color: var(--gold);
  }
  .hp-bar-outer {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hp-bar-track {
    flex: 1;
    height: 14px;
    background: #3a2f10;
    border: 2px solid var(--gold);
    position: relative;
    overflow: hidden;
  }
  .hp-bar-fill {
    position: absolute;
    inset: 0;
    width: 74%;
    background: linear-gradient(90deg, #e8b93a, var(--gold));
  }
  .hp-numbers {
    white-space: nowrap;
    color: var(--parchment);
    opacity: 0.85;
    font-size: 13px;
  }

  .player-row {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 6px;
    font-size: 15px;
  }
  .player-hp-fill {
    position: absolute;
    inset: 0;
    width: 100%;
    background: linear-gradient(90deg, #7a1f28, var(--blood));
    transition: width 0.2s ease;
  }
  .player-hp-fill.low {
    background: linear-gradient(90deg, #4a1015, #b91f2e);
  }

  .display-slot {
    position: relative;
    height: 160px;
  }

  .textbox-wrap {
    position: absolute;
    inset: 0;
    transition: opacity 0.15s ease;
  }
  .textbox {
    position: relative;
    background: var(--parchment);
    border: 3px solid var(--gold);
    border-radius: 2px;
    height: 100%;
    padding: 16px 22px 14px;
    color: var(--ink-text);
    font-family: 'Shippori Mincho', serif;
    font-size: 17px;
    line-height: 1.7;
    letter-spacing: 0.02em;
  }
  .tb-speaker {
    position: absolute;
    top: 10px;
    right: 16px;
    font-weight: 700;
    color: var(--gold);
    font-size: 13px;
    letter-spacing: 0.08em;
    display: none;
  }
  .tb-message {
    white-space: pre-line;
  }
  .tb-option {
    cursor: pointer;
  }
  .tb-option:hover,
  .tb-option.selected {
    color: var(--gold);
  }
  .textbox .placeholder {
    opacity: 0.55;
    font-style: normal;
  }

  .battle-box {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 100%;
    aspect-ratio: 1 / 1;
    width: auto;
    background: var(--ink-black-2);
    border: 3px solid var(--arcane);
    box-shadow: 0 0 0 1px var(--ink-black), 0 0 22px -4px var(--arcane-dim) inset;
    transition: opacity 0.15s ease;
  }
  .battle-box::before, .battle-box::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--arcane);
    filter: blur(1px);
    opacity: 0.7;
  }
  .battle-box::before { top: -8px; left: -8px; }
  .battle-box::after { bottom: -8px; right: -8px; }

  .display-slot[data-mode="text"] .battle-box {
    opacity: 0;
    pointer-events: none;
  }
  .display-slot[data-mode="text"] .textbox-wrap {
    opacity: 1;
  }
  .display-slot[data-mode="battle"] .battle-box {
    opacity: 1;
  }
  .display-slot[data-mode="battle"] .textbox-wrap {
    opacity: 0;
    pointer-events: none;
  }
  .display-slot[data-mode="attack"] .attack-gauge-wrap {
    opacity: 1;
    pointer-events: auto;
  }
  .display-slot[data-mode="attack"] .textbox-wrap {
    opacity: 0;
    pointer-events: none;
  }

  .bullet-canvas {
    position: absolute;
  }

  .soul {
    position: absolute;
    width: 16px;
    height: 16px;
    background: var(--blood);
    clip-path: polygon(50% 100%, 0% 38%, 20% 0%, 50% 22%, 80% 0%, 100% 38%);
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 4px rgba(209, 57, 74, 0.8));
    z-index: 2;
  }
  .soul.hit {
    animation: soulHit 0.5s ease-out;
  }
  @keyframes soulHit {
    0% { filter: drop-shadow(0 0 4px rgba(209, 57, 74, 0.8)); }
    20% { filter: drop-shadow(0 0 12px #ffffff) brightness(2.2); }
    100% { filter: drop-shadow(0 0 4px rgba(209, 57, 74, 0.8)); }
  }

  .attack-gauge-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 0 18px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    cursor: pointer;
  }
  .attack-gauge-track {
    position: relative;
    width: 100%;
    height: 30px;
    background: linear-gradient(90deg,
      #2a2333 0%,
      #6a4fbf 30%,
      var(--gold) 50%,
      #6a4fbf 70%,
      #2a2333 100%);
    border: 3px solid var(--gold);
  }
  .attack-gauge-sweet {
    position: absolute;
    top: -3px;
    bottom: -3px;
    left: calc(50% - 10px);
    width: 20px;
    border-left: 2px dashed rgba(11, 10, 18, 0.5);
    border-right: 2px dashed rgba(11, 10, 18, 0.5);
  }
  .attack-gauge-marker {
    position: absolute;
    top: -6px;
    bottom: -6px;
    left: 0%;
    width: 5px;
    background: var(--parchment);
    box-shadow: 0 0 8px 1px rgba(255, 255, 255, 0.8);
    transform: translateX(-50%);
  }
  .attack-gauge-marker.locked {
    background: var(--blood);
    box-shadow: 0 0 10px 2px rgba(209, 57, 74, 0.9);
  }
  .attack-gauge-hint {
    font-family: 'DotGothic16', sans-serif;
    font-size: 12px;
    color: var(--parchment);
    opacity: 0.6;
    letter-spacing: 0.04em;
  }

  .command-menu {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    transition: opacity 0.2s ease;
  }
  .command-menu[data-locked="true"] {
    opacity: 0.4;
    pointer-events: none;
  }
  .cmd-btn {
    position: relative;
    background: var(--ink-black);
    border: 3px solid var(--gold);
    color: var(--gold);
    font-family: 'DotGothic16', sans-serif;
    font-size: 16px;
    letter-spacing: 0.08em;
    padding: 12px 0;
    cursor: pointer;
    text-align: center;
  }
  .cmd-btn:focus-visible {
    outline: 2px solid var(--arcane);
    outline-offset: 3px;
  }
  .cmd-btn[data-selected="true"] {
    background: var(--gold);
    color: var(--ink-black);
  }
  .cmd-btn[data-selected="true"]::before {
    content: "";
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 10px;
    clip-path: polygon(50% 100%, 0% 38%, 20% 0%, 50% 22%, 80% 0%, 100% 38%);
    background: var(--ink-black);
  }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--parchment);
    opacity: 0.3;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="glyph-field" id="glyphField" aria-hidden="true"></div>

<div class="opening" id="openingScreen">
  <div class="opening-title">サマノ・スペクトゥス 戦闘</div>
  <div class="opening-sub">難易度を選択してください</div>
  <div class="difficulty-row">
    <button class="diff-btn" data-diff="tegokoro">
      <div class="diff-name">手加減</div>
      <div class="diff-desc">弾幕は控えめ<br>じっくり慣れたい人向け</div>
    </button>
    <button class="diff-btn" data-diff="mogisen">
      <div class="diff-name">模擬戦</div>
      <div class="diff-desc">標準的な手強さ<br>まずはこれで</div>
    </button>
    <button class="diff-btn" data-diff="gachi">
      <div class="diff-name">ガチ</div>
      <div class="diff-desc">弾幕もスペックも本気<br>覚悟して臨むこと</div>
    </button>
  </div>
</div>

<div class="opening" id="gameOverScreen" data-hidden="true">
  <div class="gameover-title">You lose</div>
  <div class="gameover-sub">情報の悪魔に敗れた</div>
  <button class="retry-btn" id="retryBtn">もう一度挑戦する</button>
</div>

<div class="opening" id="victoryScreen" data-hidden="true">
  <div class="victory-title">You Win!</div>
  <div class="gameover-sub">情報の悪魔を撃破した</div>
  <button class="retry-btn victory" id="victoryRetryBtn">難易度選択に戻る</button>
</div>

<div class="difficulty-badge" id="difficultyBadge"></div>


<div class="stage" id="battleStage" data-locked="true">


  <div class="boss-sprite-wrap">
    <img class="boss-sprite" src="images/boss.png" alt="サマノ・スペクトゥス">
  </div>

  <div class="stat-row">
    <span class="stat-name">情報の悪魔</span>
    <span class="stat-lv">Lv??</span>
    <div class="hp-bar-outer">
      <div class="hp-bar-track"><div class="hp-bar-fill"></div></div>
      <span class="hp-numbers">74 / 100</span>
    </div>
  </div>

  <div class="display-slot" id="displaySlot" data-mode="text">

    <div class="textbox-wrap">
      <div class="textbox" id="textbox">
        <div class="tb-speaker" id="tbSpeaker"></div>
        <div class="tb-message" id="tbMessage">（ここにセリフが入ります。あとで追加予定）</div>
      </div>
    </div>

    <div class="battle-box" id="battleBox">
      <canvas class="bullet-canvas" id="bulletCanvas"></canvas>
      <div class="soul" id="soul"></div>
    </div>

    <div class="attack-gauge-wrap" id="attackGaugeWrap">
      <div class="attack-gauge-track" id="attackGaugeTrack">
        <div class="attack-gauge-sweet"></div>
        <div class="attack-gauge-marker" id="attackMarker"></div>
      </div>
      <div class="attack-gauge-hint">SPACE または クリックで攻撃！　中央に近いほど高威力</div>
    </div>

  </div>

  <div class="command-menu" id="commandMenu">
    <button class="cmd-btn" data-cmd="fight" data-selected="true">FIGHT</button>
    <button class="cmd-btn" data-cmd="act">ACT</button>
    <button class="cmd-btn" data-cmd="item">ITEM</button>
    <button class="cmd-btn" data-cmd="mercy">MERCY</button>
  </div>

  <div class="player-row">
    <span class="stat-name">YOU</span>
    <span class="stat-lv">LV 1</span>
    <div class="hp-bar-outer">
      <div class="hp-bar-track"><div class="hp-bar-fill player-hp-fill" id="playerHpFill"></div></div>
      <span class="hp-numbers" id="playerHpNumbers">20 / 20</span>
    </div>
  </div>


</div>

<script>
  const glyphChars = ["情","報","頁","記","憶","悪","魔","手","帳","式"];
  const field = document.getElementById('glyphField');
  for (let i = 0; i < 6; i++) {
    const g = document.createElement('div');
    g.className = 'glyph';
    g.textContent = glyphChars[Math.floor(Math.random() * glyphChars.length)];
    g.style.left = (Math.random() * 96) + 'vw';
    g.style.top = (60 + Math.random() * 40) + 'vh';
    g.style.animationDelay = (Math.random() * 20) + 's';
    g.style.animationDuration = (18 + Math.random() * 10) + 's';
    field.appendChild(g);
  }

  const displaySlot = document.getElementById('displaySlot');
  const commandMenuEl = document.getElementById('commandMenu');
  const BASE_SLOT_HEIGHT = 160;
  let dodgeExtraHeight = 0;

  function measureDodgeExtraHeight() {
    const stageGap = 14; // matches .stage { gap: 14px }
    dodgeExtraHeight = commandMenuEl.offsetHeight + stageGap;
  }

  function setMode(mode) {
    displaySlot.setAttribute('data-mode', mode);
    if (mode === 'battle') {
      if (dodgeExtraHeight === 0) measureDodgeExtraHeight();
      commandMenuEl.style.display = 'none';
      displaySlot.style.height = (BASE_SLOT_HEIGHT + dodgeExtraHeight) + 'px';
      initSoulPosition();
    } else {
      commandMenuEl.style.display = '';
      displaySlot.style.height = BASE_SLOT_HEIGHT + 'px';
    }
  }

  const battleBox = document.getElementById('battleBox');
  const soul = document.getElementById('soul');
  const bulletCanvas = document.getElementById('bulletCanvas');
  const bulletCtx = bulletCanvas.getContext('2d');

  // dragon bullet sprite (uploaded artwork, recolored to a white silhouette with transparency)
  const dragonSprite = new Image();
  let dragonSpriteLoaded = false;
  let dragonSpriteAspect = 0.295; // fallback height/width ratio until it finishes loading
  dragonSprite.onload = () => {
    dragonSpriteLoaded = true;
    dragonSpriteAspect = dragonSprite.naturalHeight / dragonSprite.naturalWidth;
  };
  dragonSprite.src = 'images/dragon.png';

  // sword bullet sprite (uploaded katana artwork, recolored to a white silhouette with transparency).
  // The blade runs diagonally within the image (tip near top-right, handle near bottom-left);
  // SWORD_TIP_ANGLE is that diagonal's angle, used to align the tip with the travel direction.
  const swordSprite = new Image();
  let swordSpriteLoaded = false;
  const SWORD_IMG_ASPECT = 1006 / 1276; // fallback height/width ratio until it finishes loading
  const SWORD_BLADE_LENGTH_PX = 1592.4; // tip-to-handle length measured in the source image
  const SWORD_TIP_ANGLE = 142.8 * (Math.PI / 180); // corrects the image's intrinsic diagonal tilt
  swordSprite.onload = () => { swordSpriteLoaded = true; };
  swordSprite.src = 'images/sword.png';

  const SOUL_SIZE = 16;
  const SPEED = 180; // px/sec
  let pos = { x: 0, y: 0 };
  let boxSize = { w: 0, h: 0 };
  const keys = {};
  const BULLET_CANVAS_MARGIN = 60; // px of extra space around the box where bullets (e.g. swords) stay visible

  function initSoulPosition() {
    boxSize.w = battleBox.clientWidth;
    boxSize.h = battleBox.clientHeight;
    pos.x = boxSize.w / 2;
    pos.y = boxSize.h / 2;
    bulletCanvas.width = boxSize.w + BULLET_CANVAS_MARGIN * 2;
    bulletCanvas.height = boxSize.h + BULLET_CANVAS_MARGIN * 2;
    bulletCanvas.style.left = (-BULLET_CANVAS_MARGIN) + 'px';
    bulletCanvas.style.top = (-BULLET_CANVAS_MARGIN) + 'px';
    bulletCanvas.style.width = bulletCanvas.width + 'px';
    bulletCanvas.style.height = bulletCanvas.height + 'px';
    render();
  }

  function render() {
    soul.style.left = pos.x + 'px';
    soul.style.top = pos.y + 'px';
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  // ---- 式神弾幕（Shikigami bullet pattern） ----
  let bullets = [];
  let patternActive = false;
  const PATTERN_TYPES = ['fox', 'dragon', 'sword'];
  let currentPatternType = 'fox'; // cycles each enemy turn through PATTERN_TYPES
  let spawnAccumulator = 0;
  let currentSpawnInterval = 400; // ms, adjusted by difficulty
  let invincible = false;

  function bulletDensity() {
    const cfg = DIFFICULTY[currentDifficulty];
    return cfg ? cfg.bulletDensity : 1.0;
  }

  function spawnShikigamiBullet() {
    const density = bulletDensity();
    const r = 9 + Math.random() * 4;
    const y = r + Math.random() * (boxSize.h - r * 2);
    const speed = (70 + Math.random() * 40) * Math.min(density, 2.8);
    bullets.push({ type: 'fox', x: boxSize.w + r, y, vx: -speed, vy: 0, r });
  }

  function spawnDragonBullet() {
    const density = bulletDensity();
    const w = boxSize.w;
    const h = boxSize.h;
    const s = 16 + Math.random() * 8; // half-length scale of the dragon silhouette
    const r = s * 0.6; // hitbox, smaller than the visual body for fairness
    const speed = (75 + Math.random() * 35) * Math.min(density, 2.5);
    const margin = s * 2.2;
    const side = Math.floor(Math.random() * 4); // 0 top, 1 bottom, 2 left, 3 right
    let x, y, vx, vy;
    if (side === 0) {
      x = Math.random() * w; y = -margin;
      vx = (Math.random() - 0.5) * speed * 0.5; vy = speed;
    } else if (side === 1) {
      x = Math.random() * w; y = h + margin;
      vx = (Math.random() - 0.5) * speed * 0.5; vy = -speed;
    } else if (side === 2) {
      x = -margin; y = Math.random() * h;
      vx = speed; vy = (Math.random() - 0.5) * speed * 0.5;
    } else {
      x = w + margin; y = Math.random() * h;
      vx = -speed; vy = (Math.random() - 0.5) * speed * 0.5;
    }
    const angle = Math.atan2(vy, vx);
    bullets.push({ type: 'dragon', x, y, vx, vy, r, visualR: s, angle });
  }

  function spawnSwordBullet() {
    const density = bulletDensity();
    const w = boxSize.w;
    const h = boxSize.h;
    const s = 20 + Math.random() * 8; // half-length scale of the blade
    const r = s * 0.4; // hitbox, thinner than the visual blade
    const speed = (110 + Math.random() * 55) * Math.min(density, 2.5);
    const margin = s * 2.6;
    const side = Math.floor(Math.random() * 4); // 0 top, 1 bottom, 2 left, 3 right
    let x, y;
    if (side === 0) { x = Math.random() * w; y = -margin; }
    else if (side === 1) { x = Math.random() * w; y = h + margin; }
    else if (side === 2) { x = -margin; y = Math.random() * h; }
    else { x = w + margin; y = Math.random() * h; }
    // fires in a straight line at the player's position at the moment it's launched
    const dx = pos.x - x, dy = pos.y - y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const vx = (dx / dist) * speed;
    const vy = (dy / dist) * speed;
    const angle = Math.atan2(vy, vx);
    bullets.push({ type: 'sword', x, y, vx, vy, r, visualR: s, angle });
  }

  function spawnPatternBullet() {
    if (currentPatternType === 'dragon') spawnDragonBullet();
    else if (currentPatternType === 'sword') spawnSwordBullet();
    else spawnShikigamiBullet();
  }

  function updateBullets(dt) {
    for (const b of bullets) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    }
    bullets = bullets.filter((b) => {
      const m = (b.visualR || b.r) * 2 + 30;
      return b.x > -m && b.x < boxSize.w + m && b.y > -m && b.y < boxSize.h + m;
    });
  }

  function drawFoxBullet(b) {
    bulletCtx.beginPath();
    bulletCtx.fillStyle = 'rgba(255, 255, 255, 0.92)';
    bulletCtx.strokeStyle = 'rgba(180, 200, 255, 0.6)';
    bulletCtx.lineWidth = 1.5;
    bulletCtx.shadowColor = 'rgba(255, 255, 255, 0.6)';
    bulletCtx.shadowBlur = 6;
    bulletCtx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    bulletCtx.fill();
    bulletCtx.stroke();
    // fox-like ears to suggest a shikigami silhouette
    bulletCtx.beginPath();
    bulletCtx.moveTo(b.x - b.r * 0.5, b.y - b.r * 0.8);
    bulletCtx.lineTo(b.x - b.r * 0.9, b.y - b.r * 1.6);
    bulletCtx.lineTo(b.x - b.r * 0.1, b.y - b.r * 1.1);
    bulletCtx.closePath();
    bulletCtx.fill();
    bulletCtx.stroke();
    bulletCtx.beginPath();
    bulletCtx.moveTo(b.x + b.r * 0.5, b.y - b.r * 0.8);
    bulletCtx.lineTo(b.x + b.r * 0.9, b.y - b.r * 1.6);
    bulletCtx.lineTo(b.x + b.r * 0.1, b.y - b.r * 1.1);
    bulletCtx.closePath();
    bulletCtx.fill();
    bulletCtx.stroke();
    bulletCtx.shadowBlur = 0;
  }

  function drawDragonBulletVector(b) {
    const s = b.visualR;
    bulletCtx.save();
    bulletCtx.translate(b.x, b.y);
    bulletCtx.rotate(b.angle);
    bulletCtx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    bulletCtx.strokeStyle = 'rgba(15, 12, 10, 0.9)';
    bulletCtx.lineWidth = 1.4;
    bulletCtx.shadowColor = 'rgba(255, 190, 110, 0.65)';
    bulletCtx.shadowBlur = 8;

    // body + serpentine mane + head silhouette (local +x = facing/travel direction)
    bulletCtx.beginPath();
    bulletCtx.moveTo(-s * 1.85, s * 0.05); // tail tip
    bulletCtx.quadraticCurveTo(-s * 1.55, -s * 0.35, -s * 1.15, -s * 0.08); // tail curling up
    bulletCtx.lineTo(-s * 1.35, -s * 0.5); // fin spike 1 (tail)
    bulletCtx.lineTo(-s * 0.98, -s * 0.22);
    bulletCtx.lineTo(-s * 1.08, -s * 0.72); // fin spike 2
    bulletCtx.lineTo(-s * 0.68, -s * 0.35);
    bulletCtx.lineTo(-s * 0.72, -s * 0.9); // fin spike 3 (mane peak)
    bulletCtx.lineTo(-s * 0.32, -s * 0.45);
    bulletCtx.lineTo(-s * 0.3, -s * 0.92); // fin spike 4
    bulletCtx.lineTo(s * 0.05, -s * 0.5);
    bulletCtx.lineTo(s * 0.0, -s * 0.85); // fin spike 5 (near head)
    bulletCtx.lineTo(s * 0.3, -s * 0.42);
    bulletCtx.lineTo(s * 0.42, -s * 0.58); // brow horn
    bulletCtx.lineTo(s * 0.56, -s * 0.34);
    bulletCtx.quadraticCurveTo(s * 0.92, -s * 0.32, s * 1.4, -s * 0.06); // snout top curve
    bulletCtx.lineTo(s * 1.62, s * 0.05); // nose tip
    bulletCtx.lineTo(s * 1.3, s * 0.15); // upper jaw underside
    bulletCtx.lineTo(s * 1.08, s * 0.05); // teeth zigzag (lower jaw)
    bulletCtx.lineTo(s * 0.97, s * 0.24);
    bulletCtx.lineTo(s * 0.79, s * 0.09);
    bulletCtx.lineTo(s * 0.71, s * 0.27);
    bulletCtx.lineTo(s * 0.52, s * 0.11);
    bulletCtx.lineTo(s * 0.45, s * 0.29); // chin
    bulletCtx.quadraticCurveTo(s * 0.1, s * 0.37, -s * 0.3, s * 0.3); // throat/belly curve
    bulletCtx.quadraticCurveTo(-s * 0.72, s * 0.24, -s * 1.12, s * 0.36);
    bulletCtx.lineTo(-s * 1.55, s * 0.24);
    bulletCtx.closePath();
    bulletCtx.fill();
    bulletCtx.stroke();
    bulletCtx.shadowBlur = 0;

    // brow line above the eye
    bulletCtx.beginPath();
    bulletCtx.strokeStyle = 'rgba(15, 12, 10, 0.9)';
    bulletCtx.lineWidth = 1.6;
    bulletCtx.moveTo(s * 0.42, -s * 0.28);
    bulletCtx.lineTo(s * 0.68, -s * 0.2);
    bulletCtx.stroke();

    // eye
    bulletCtx.beginPath();
    bulletCtx.fillStyle = 'rgba(15, 12, 10, 0.9)';
    bulletCtx.arc(s * 0.68, -s * 0.13, s * 0.09, 0, Math.PI * 2);
    bulletCtx.fill();

    bulletCtx.restore();
  }

  function drawDragonBullet(b) {
    if (!dragonSpriteLoaded) {
      drawDragonBulletVector(b);
      return;
    }
    const s = b.visualR;
    const drawW = s * 3.6;
    const drawH = drawW * dragonSpriteAspect;
    bulletCtx.save();
    bulletCtx.translate(b.x, b.y);
    bulletCtx.rotate(b.angle);
    bulletCtx.scale(-1, 1); // source art faces left; flip so the head leads the travel direction
    bulletCtx.shadowColor = 'rgba(255, 190, 110, 0.65)';
    bulletCtx.shadowBlur = 8;
    bulletCtx.drawImage(dragonSprite, -drawW / 2, -drawH / 2, drawW, drawH);
    bulletCtx.shadowBlur = 0;
    bulletCtx.restore();
  }

  function drawSwordBulletVector(b) {
    const s = b.visualR;
    bulletCtx.save();
    bulletCtx.translate(b.x, b.y);
    bulletCtx.rotate(b.angle);
    bulletCtx.fillStyle = 'rgba(255, 255, 255, 0.96)';
    bulletCtx.strokeStyle = 'rgba(15, 12, 10, 0.9)';
    bulletCtx.lineWidth = 1.4;
    bulletCtx.shadowColor = 'rgba(200, 220, 255, 0.75)';
    bulletCtx.shadowBlur = 7;

    // blade (tapers to a point at the tip, leading in the direction of travel)
    bulletCtx.beginPath();
    bulletCtx.moveTo(s * 1.3, 0);
    bulletCtx.lineTo(s * 0.9, -s * 0.16);
    bulletCtx.lineTo(-s * 0.55, -s * 0.11);
    bulletCtx.lineTo(-s * 0.55, s * 0.11);
    bulletCtx.lineTo(s * 0.9, s * 0.16);
    bulletCtx.closePath();
    bulletCtx.fill();
    bulletCtx.stroke();

    // center ridge line on the blade
    bulletCtx.beginPath();
    bulletCtx.strokeStyle = 'rgba(15, 12, 10, 0.4)';
    bulletCtx.lineWidth = 1;
    bulletCtx.moveTo(s * 0.85, 0);
    bulletCtx.lineTo(-s * 0.5, 0);
    bulletCtx.stroke();

    // crossguard
    bulletCtx.strokeStyle = 'rgba(15, 12, 10, 0.9)';
    bulletCtx.lineWidth = 1.4;
    bulletCtx.beginPath();
    bulletCtx.moveTo(-s * 0.55, -s * 0.32);
    bulletCtx.lineTo(-s * 0.72, -s * 0.32);
    bulletCtx.lineTo(-s * 0.72, s * 0.32);
    bulletCtx.lineTo(-s * 0.55, s * 0.32);
    bulletCtx.closePath();
    bulletCtx.fill();
    bulletCtx.stroke();

    // handle
    bulletCtx.beginPath();
    bulletCtx.moveTo(-s * 0.72, -s * 0.09);
    bulletCtx.lineTo(-s * 1.15, -s * 0.09);
    bulletCtx.lineTo(-s * 1.15, s * 0.09);
    bulletCtx.lineTo(-s * 0.72, s * 0.09);
    bulletCtx.closePath();
    bulletCtx.fill();
    bulletCtx.stroke();

    // pommel
    bulletCtx.beginPath();
    bulletCtx.arc(-s * 1.15, 0, s * 0.1, 0, Math.PI * 2);
    bulletCtx.fill();
    bulletCtx.stroke();

    bulletCtx.shadowBlur = 0;
    bulletCtx.restore();
  }

  function drawSwordBullet(b) {
    if (!swordSpriteLoaded) {
      drawSwordBulletVector(b);
      return;
    }
    const s = b.visualR;
    const targetLength = s * 2.8; // desired on-screen tip-to-handle length
    const scale = targetLength / SWORD_BLADE_LENGTH_PX;
    const drawW = swordSprite.naturalWidth * scale;
    const drawH = swordSprite.naturalHeight * scale;
    bulletCtx.save();
    bulletCtx.translate(b.x, b.y);
    bulletCtx.rotate(b.angle);
    bulletCtx.rotate(SWORD_TIP_ANGLE); // align the source art's diagonal blade with the travel direction
    bulletCtx.shadowColor = 'rgba(200, 220, 255, 0.75)';
    bulletCtx.shadowBlur = 7;
    bulletCtx.drawImage(swordSprite, -drawW / 2, -drawH / 2, drawW, drawH);
    bulletCtx.shadowBlur = 0;
    bulletCtx.restore();
  }

  function drawBullets() {
    bulletCtx.clearRect(0, 0, bulletCanvas.width, bulletCanvas.height);
    bulletCtx.save();
    bulletCtx.translate(BULLET_CANVAS_MARGIN, BULLET_CANVAS_MARGIN);

    // sword bullets stay visible even outside the box (drawn before the clip below)
    for (const b of bullets) {
      if (b.type === 'sword') drawSwordBullet(b);
    }

    // other bullet types stay confined to the visible box, as before
    bulletCtx.save();
    bulletCtx.beginPath();
    bulletCtx.rect(0, 0, boxSize.w, boxSize.h);
    bulletCtx.clip();
    for (const b of bullets) {
      if (b.type === 'dragon') drawDragonBullet(b);
      else if (b.type !== 'sword') drawFoxBullet(b);
    }
    bulletCtx.restore();

    bulletCtx.restore();
  }

  function checkCollisions() {
    if (invincible) return;
    const soulHalf = (SOUL_SIZE / 2) * 0.6;
    for (const b of bullets) {
      const dx = b.x - pos.x;
      const dy = b.y - pos.y;
      if (Math.sqrt(dx * dx + dy * dy) < b.r + soulHalf) {
        hitSoul();
        break;
      }
    }
  }

  function hitSoul() {
    invincible = true;
    soul.classList.add('hit');
    damagePlayer();
    setTimeout(() => {
      soul.classList.remove('hit');
      invincible = false;
    }, 500);
  }

  function runShikigamiPattern(durationMs) {
    return new Promise((resolve) => {
      currentPatternType = PATTERN_TYPES[(PATTERN_TYPES.indexOf(currentPatternType) + 1) % PATTERN_TYPES.length];
      bullets = [];
      spawnAccumulator = 0;
      currentSpawnInterval = Math.max(90, 380 / bulletDensity());
      patternActive = true;
      setTimeout(() => {
        patternActive = false;
        bullets = [];
        bulletCtx.clearRect(0, 0, bulletCanvas.width, bulletCanvas.height);
        resolve();
      }, durationMs);
    });
  }

  // ---- main loop ----
  let lastFrameTime = null;
  function tick(now) {
    if (lastFrameTime == null) lastFrameTime = now;
    const dt = (now - lastFrameTime) / 1000;
    lastFrameTime = now;

    if (displaySlot.getAttribute('data-mode') === 'battle') {
      let dx = 0, dy = 0;
      if (keys['ArrowLeft'] || keys['a']) dx -= 1;
      if (keys['ArrowRight'] || keys['d']) dx += 1;
      if (keys['ArrowUp'] || keys['w']) dy -= 1;
      if (keys['ArrowDown'] || keys['s']) dy += 1;
      if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
      pos.x = clamp(pos.x + dx * SPEED * dt, SOUL_SIZE / 2, boxSize.w - SOUL_SIZE / 2);
      pos.y = clamp(pos.y + dy * SPEED * dt, SOUL_SIZE / 2, boxSize.h - SOUL_SIZE / 2);
      render();
    }

    if (patternActive) {
      spawnAccumulator += dt * 1000;
      if (spawnAccumulator >= currentSpawnInterval) {
        spawnAccumulator = 0;
        spawnPatternBullet();
      }
    }
    if (bullets.length > 0 || patternActive) {
      updateBullets(dt);
      drawBullets();
      checkCollisions();
    } else {
      bulletCtx.clearRect(0, 0, bulletCanvas.width, bulletCanvas.height);
    }

    requestAnimationFrame(tick);
  }

  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });
  window.addEventListener('resize', () => {
    if (displaySlot.getAttribute('data-mode') === 'battle') initSoulPosition();
  });

  initSoulPosition();
  requestAnimationFrame(tick);

  const buttons = Array.from(document.querySelectorAll('.cmd-btn'));
  let selectedIndex = 0;
  function updateSelection() {
    buttons.forEach((b, i) => {
      if (i === selectedIndex) b.setAttribute('data-selected', 'true');
      else b.removeAttribute('data-selected');
    });
  }
  window.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    if (battleStage.getAttribute('data-locked') === 'true') return;
    if (commandMenu.getAttribute('data-locked') === 'true') return;
    if (e.key === 'ArrowLeft') {
      selectedIndex = (selectedIndex - 1 + buttons.length) % buttons.length;
      updateSelection();
    } else {
      selectedIndex = (selectedIndex + 1) % buttons.length;
      updateSelection();
    }
  });
  buttons.forEach((b, i) => {
    b.addEventListener('click', () => {
      selectedIndex = i;
      updateSelection();
      b.blur(); // avoid native SPACE-activates-focused-button side effects later
      if (b.dataset.cmd === 'fight') startFightTurn();
      else if (b.dataset.cmd === 'act') startActTurn();
    });
  });

  // ---- Turn sequence: player attacks -> enemy attacks back ----
  const commandMenu = document.getElementById('commandMenu');
  const tbMessage = document.getElementById('tbMessage');
  const tbSpeaker = document.getElementById('tbSpeaker');
  let isResolving = false;
  let battleOver = false;

  function setMessage(text, speaker) {
    tbMessage.textContent = text;
    if (speaker) {
      tbSpeaker.textContent = speaker;
      tbSpeaker.style.display = '';
    } else {
      tbSpeaker.textContent = '';
      tbSpeaker.style.display = 'none';
    }
  }

  function lockMenu(locked) {
    commandMenu.setAttribute('data-locked', locked ? 'true' : 'false');
  }

  function wait(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  function selectOption(promptText, options) {
    setMode('text');
    let selIdx = 0;

    tbSpeaker.style.display = 'none';
    tbSpeaker.textContent = '';
    tbMessage.innerHTML = '';

    const promptEl = document.createElement('div');
    promptEl.textContent = promptText;
    tbMessage.appendChild(promptEl);

    const optionEls = options.map((opt) => {
      const el = document.createElement('div');
      el.className = 'tb-option';
      tbMessage.appendChild(el);
      return el;
    });

    function render() {
      optionEls.forEach((el, i) => {
        el.textContent = (i === selIdx ? '▶ ' : '　　') + options[i];
        el.classList.toggle('selected', i === selIdx);
      });
    }
    render();

    return new Promise((resolve) => {
      function cleanup() {
        window.removeEventListener('keydown', onKey);
        optionEls.forEach((el, i) => el.removeEventListener('click', clickHandlers[i]));
      }
      function finish(idx) {
        cleanup();
        resolve(options[idx]);
      }
      function onKey(e) {
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          selIdx = (selIdx - 1 + options.length) % options.length;
          render();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          selIdx = (selIdx + 1) % options.length;
          render();
        } else if (e.key === ' ' || e.code === 'Space') {
          e.preventDefault();
          finish(selIdx);
        }
      }
      const clickHandlers = optionEls.map((el, i) => {
        const handler = () => {
          selIdx = i;
          render();
          finish(i);
        };
        el.addEventListener('click', handler);
        return handler;
      });
      window.addEventListener('keydown', onKey);
    });
  }

  const TARGETS = ['サマノ・スペクトゥス'];
  const ACT_ACTIONS = ['しらべる', 'なでる'];

  function selectTarget() {
    return selectOption('だれを　ねらう？', [...TARGETS, 'もどる']);
  }

  function selectAction() {
    return selectOption('なにを　する？', [...ACT_ACTIONS, 'もどる']);
  }

  async function startFightTurn() {
    if (isResolving || battleOver) return;
    isResolving = true;
    lockMenu(true);

    const target = await selectTarget();
    if (target === 'もどる') {
      setMode('text');
      setMessage('（ここにセリフが入ります。あとで追加予定）');
      lockMenu(false);
      isResolving = false;
      return;
    }

    setMode('text');
    setMessage('あなたの攻撃！');
    await wait(600);

    const dmg = await runAttackGauge();
    damageBoss(dmg);

    setMode('text');
    setMessage(dmg + ' のダメージ！');
    await wait(900);

    if (bossHP <= 0) {
      showVictory();
      return;
    }

    setMessage('情報の悪魔の攻撃……！');
    await wait(900);

    setMode('battle');
    await runShikigamiPattern(3200);

    if (playerHP <= 0) {
      showGameOver();
      return;
    }

    setMode('text');
    setMessage('（ここにセリフが入ります。あとで追加予定）');
    lockMenu(false);
    isResolving = false;
  }

  async function startActTurn() {
    if (isResolving || battleOver) return;
    isResolving = true;
    lockMenu(true);

    const action = await selectAction();
    if (action === 'もどる') {
      setMode('text');
      setMessage('（ここにセリフが入ります。あとで追加予定）');
      lockMenu(false);
      isResolving = false;
      return;
    }

    setMode('text');
    if (action === 'しらべる') {
      setMessage(
        'サマノ・スペクトゥスを　しらべた。\n' +
        'HP ' + Math.max(0, bossHP) + ' / ' + bossHPMax + '\n' +
        '無数の瞳が、あなたのすべてを値踏みしている。'
      );
      await wait(1400);
    } else if (action === 'なでる') {
      setMessage('サマノ・スペクトゥスを　なでた。');
      await wait(1200);
      setMessage('「撫でンナ！」', 'サマノ・スペクトゥス');
      await wait(1200);
    }

    setMessage('情報の悪魔の攻撃……！');
    await wait(900);

    setMode('battle');
    await runShikigamiPattern(3200);

    if (playerHP <= 0) {
      showGameOver();
      return;
    }

    setMode('text');
    setMessage('（ここにセリフが入ります。あとで追加予定）');
    lockMenu(false);
    isResolving = false;
  }

  // ---- Difficulty configuration ----
  const DIFFICULTY = {
    tegokoro: { label: '手加減', hpMax: 60,  bulletDensity: 1.0, specDesc: 'スペの本気度：控えめ', playerDamage: 3 },
    mogisen:  { label: '模擬戦', hpMax: 100, bulletDensity: 1.6, specDesc: 'スペの本気度：標準',   playerDamage: 5 },
    gachi:    { label: 'ガチ',   hpMax: 150, bulletDensity: 2.6, specDesc: 'スペの本気度：全開',   playerDamage: 8 },
  };
  let currentDifficulty = null;

  const openingScreen = document.getElementById('openingScreen');
  const battleStage = document.getElementById('battleStage');
  const difficultyBadge = document.getElementById('difficultyBadge');
  const hpFill = document.querySelector('.hp-bar-fill');
  const hpNumbers = document.querySelector('.hp-numbers');

  // ---- Player HP ----
  const PLAYER_HP_MAX = 20;
  let playerHP = PLAYER_HP_MAX;
  const playerHpFill = document.getElementById('playerHpFill');
  const playerHpNumbers = document.getElementById('playerHpNumbers');

  function updatePlayerHPUI() {
    const ratio = Math.max(0, playerHP / PLAYER_HP_MAX);
    if (playerHpFill) {
      playerHpFill.style.width = (ratio * 100) + '%';
      playerHpFill.classList.toggle('low', playerHP <= PLAYER_HP_MAX * 0.3);
    }
    if (playerHpNumbers) playerHpNumbers.textContent = Math.max(0, playerHP) + ' / ' + PLAYER_HP_MAX;
  }

  function damagePlayer() {
    if (!currentDifficulty) return;
    const cfg = DIFFICULTY[currentDifficulty];
    playerHP = Math.max(0, playerHP - cfg.playerDamage);
    updatePlayerHPUI();
  }

  function resetPlayerHP() {
    playerHP = PLAYER_HP_MAX;
    updatePlayerHPUI();
  }

  function applyDifficulty(key) {
    currentDifficulty = key;
    const cfg = DIFFICULTY[key];
    difficultyBadge.textContent = '難易度：' + cfg.label;
    bossHPMax = cfg.hpMax;
    bossHP = cfg.hpMax;
    updateBossHPUI();
    resetPlayerHP();
  }

  // ---- Boss HP ----
  let bossHPMax = 0;
  let bossHP = 0;

  function updateBossHPUI() {
    const ratio = bossHPMax > 0 ? Math.max(0, bossHP / bossHPMax) : 0;
    if (hpFill) hpFill.style.width = (ratio * 100) + '%';
    if (hpNumbers) hpNumbers.textContent = Math.max(0, bossHP) + ' / ' + bossHPMax;
  }

  function damageBoss(dmg) {
    bossHP = Math.max(0, bossHP - dmg);
    updateBossHPUI();
  }

  // ---- Attack gauge (player's FIGHT input) ----
  const attackGaugeTrack = document.getElementById('attackGaugeTrack');
  const attackMarker = document.getElementById('attackMarker');
  let attackAnimId = null;
  let attackActive = false;
  let attackPos = 0;
  let attackDir = 1;

  function attackSpeedForDifficulty() {
    const cfg = DIFFICULTY[currentDifficulty];
    const density = cfg ? cfg.bulletDensity : 1.0;
    return 95 + density * 45; // %-of-track per second; harder difficulty = faster marker
  }

  function startAttackAnim() {
    attackActive = true;
    attackPos = 0;
    attackDir = 1;
    const speed = attackSpeedForDifficulty();
    let last = null;
    function frame(now) {
      if (!attackActive) return;
      if (last == null) last = now;
      const dt = (now - last) / 1000;
      last = now;
      attackPos += attackDir * speed * dt;
      if (attackPos >= 100) { attackPos = 100; attackDir = -1; }
      if (attackPos <= 0) { attackPos = 0; attackDir = 1; }
      if (attackMarker) attackMarker.style.left = attackPos + '%';
      attackAnimId = requestAnimationFrame(frame);
    }
    attackAnimId = requestAnimationFrame(frame);
  }

  function stopAttackAnim() {
    attackActive = false;
    if (attackAnimId) cancelAnimationFrame(attackAnimId);
    attackAnimId = null;
  }

  function computeAttackDamage(posPercent) {
    const dist = Math.abs(posPercent - 50); // 0 (center) .. 50 (edge)
    const power = Math.max(0, 1 - dist / 50); // 1 at center, 0 at edges
    const MIN_DMG = 2;
    const MAX_DMG = 16;
    return Math.round(MIN_DMG + power * (MAX_DMG - MIN_DMG));
  }

  function runAttackGauge() {
    setMode('attack');
    startAttackAnim();
    return new Promise((resolve) => {
      function onInput(e) {
        if (e.type === 'keydown') {
          if (e.key !== ' ' && e.code !== 'Space') return;
          e.preventDefault();
        }
        cleanup();
        stopAttackAnim();
        if (attackMarker) attackMarker.classList.add('locked');
        const dmg = computeAttackDamage(attackPos);
        setTimeout(() => {
          if (attackMarker) attackMarker.classList.remove('locked');
          resolve(dmg);
        }, 300);
      }
      function cleanup() {
        window.removeEventListener('keydown', onInput);
        attackGaugeTrack.removeEventListener('click', onInput);
      }
      window.addEventListener('keydown', onInput);
      attackGaugeTrack.addEventListener('click', onInput);
    });
  }

  // ---- Game over / retry ----
  const gameOverScreen = document.getElementById('gameOverScreen');
  const retryBtn = document.getElementById('retryBtn');
  const victoryScreen = document.getElementById('victoryScreen');
  const victoryRetryBtn = document.getElementById('victoryRetryBtn');

  function showGameOver() {
    battleOver = true;
    patternActive = false;
    lockMenu(true);
    gameOverScreen.setAttribute('data-hidden', 'false');
  }

  function showVictory() {
    battleOver = true;
    patternActive = false;
    lockMenu(true);
    victoryScreen.setAttribute('data-hidden', 'false');
  }

  function resetToOpening() {
    gameOverScreen.setAttribute('data-hidden', 'true');
    victoryScreen.setAttribute('data-hidden', 'true');
    battleStage.setAttribute('data-locked', 'true');
    openingScreen.setAttribute('data-hidden', 'false');

    bullets = [];
    patternActive = false;
    battleOver = false;
    isResolving = false;
    lockMenu(false);
    setMode('text');
    setMessage('（ここにセリフが入ります。あとで追加予定）');
  }

  retryBtn.addEventListener('click', resetToOpening);
  victoryRetryBtn.addEventListener('click', resetToOpening);

  document.querySelectorAll('.diff-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      applyDifficulty(btn.dataset.diff);
      openingScreen.setAttribute('data-hidden', 'true');
      battleStage.setAttribute('data-locked', 'false');
      btn.blur(); // don't leave a hidden button focused — it would still catch SPACE natively
    });
  });

  // SPACE also confirms the selected command-menu button, and dismisses
  // the game-over / victory overlays — the same "decision" key everywhere.
  // preventDefault runs unconditionally so SPACE never falls through to the
  // browser's native "activate the focused button" behavior mid-battle.
  window.addEventListener('keydown', (e) => {
    if (e.key !== ' ' && e.code !== 'Space') return;
    e.preventDefault();
    if (gameOverScreen.getAttribute('data-hidden') === 'false') {
      resetToOpening();
      return;
    }
    if (victoryScreen.getAttribute('data-hidden') === 'false') {
      resetToOpening();
      return;
    }
    if (battleStage.getAttribute('data-locked') === 'true') return;
    if (commandMenu.getAttribute('data-locked') === 'true') return;
    buttons[selectedIndex].click();
  });
</script>

</body>
</html>
